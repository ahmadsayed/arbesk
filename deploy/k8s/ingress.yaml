# Ingress for https://promptscad.com.
# TLS is terminated at Cloudflare (proxied DNS) — the cluster sees plain HTTP
# on port 80 with the original Host header, so no cert-manager/TLS section.
# WebSocket upgrades (chat proxy + Nostr relay) pass through Traefik natively
# and Cloudflare's proxy supports WS/WSS.
# nostr-rs-relay only accepts the WS upgrade on `/` — it 404s any other path
# (verified: "Nothing here." on /nostr) — so the middleware strips the /nostr
# prefix before proxying. Requests not starting with /nostr pass through
# unchanged, so the middleware is safe to attach ingress-wide.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nostr-strip
spec:
  stripPrefix:
    prefixes:
      - /nostr
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arbesk
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-nostr-strip@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: promptscad.com
      http:
        paths:
          # Browser-facing Nostr relay (PUBLIC_NOSTR_URL=wss://promptscad.com/nostr).
          # The nostr-strip middleware above rewrites /nostr → / before proxying.
          - path: /nostr
            pathType: Prefix
            backend:
              service:
                name: nostr
                port:
                  number: 7777
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arbesk
                port:
                  number: 80
